name: Release

on:
  push:
    tags:
      - '*/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine project info
        id: project
        run: |
          TAG="${{ github.ref_name }}"
          PROJECT="${TAG%%/*}"
          VERSION="${TAG#*/}"
          PKG_NAME=$(node -p "require('./${PROJECT}/package.json').name")
          echo "project=${PROJECT}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "pkg-name=${PKG_NAME}" >> $GITHUB_OUTPUT

      - name: Build
        run: pnpm --filter "${{ steps.project.outputs.pkg-name }}" build

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ steps.project.outputs.project }} ${{ steps.project.outputs.version }}"
          files: ${{ steps.project.outputs.project }}/dist/${{ steps.project.outputs.pkg-name }}.user.js

